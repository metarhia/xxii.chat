<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XXII Distributed Chat Application with offline support and real-time communication" />
  <meta name="theme-color" content="#090a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="XXII Chat" />
  <title>XXII Chat</title>
  <link rel="stylesheet" href="/default.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/vnd.microsoft.icon" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <span class="logo">≡</span>
        <h1>XXII Chat</h1>
        <span id="connection-status" class="status offline">offline</span>
      </header>

      <label class="nick">
        <span class="accent">@</span>
        <input id="username-input" type="text" maxlength="32" placeholder="your nick" />
      </label>

      <section class="section">
        <h2>Chats</h2>
        <ul id="chat-list" class="list"></ul>
        <form id="chat-form" class="inline-form">
          <input id="chat-name-input" type="text" maxlength="64" placeholder="+ new chat" />
        </form>
      </section>

      <section class="section">
        <h2>Peers</h2>
        <div class="peer">
          <input id="peer-room" type="text" value="xxii" placeholder="room" />
          <div class="row">
            <button id="peer-host-btn" class="link-btn">[host]</button>
            <button id="peer-join-btn" class="link-btn">[join]</button>
            <button id="peer-leave-btn" class="link-btn" disabled>[leave]</button>
          </div>
          <p id="peer-status" class="hint">
            Host in one browser, join in another while the server is up,
            then chat keeps going over WebRTC and reaches the server later.
          </p>
        </div>
      </section>

      <footer class="tools">
        <button id="install-btn" class="link-btn hidden">[install]</button>
        <span id="install-status" class="hint hidden">install available</span>
        <button id="update-cache-btn" class="link-btn">[update cache]</button>
        <button id="clear-messages-btn" class="link-btn">[clear database]</button>
      </footer>
    </aside>

    <main class="timeline">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" title="Menu">≡</button>
        <div class="context">
          <span id="chat-title" class="accent">!general</span>
          <span class="separator">|</span>
          <span id="chat-info" class="muted"></span>
        </div>
        <nav class="actions">
          <button id="search-btn" class="link-btn">[Search]</button>
          <button id="log-btn" class="link-btn">[Log]</button>
        </nav>
      </header>
      <div id="search-bar" class="search hidden">
        <input id="search-input" type="search" placeholder="filter messages in this chat" />
      </div>
      <div id="chat-messages" class="messages">
        <button id="load-more-btn" class="link-btn load-more hidden">[load older messages]</button>
        <div id="message-list"></div>
      </div>
      <div class="hint-bar">Enter send | Shift+Enter new line</div>
      <form id="composer" class="composer">
        <textarea id="message-input" rows="2" placeholder="> message to !general"></textarea>
        <div class="composer-bar">
          <span id="composer-info" class="muted"></span>
          <button id="send-btn" class="send" type="submit">Send</button>
        </div>
      </form>
    </main>

    <aside id="details" class="details">
      <header class="panel-title">
        <span>ACTIVITY LOG</span>
        <button id="clear-btn" class="link-btn">[clear]</button>
      </header>
      <pre id="output" class="log"></pre>
    </aside>
  </div>

  <div id="notification" class="notification hidden"></div>

  <template id="chat-item-template">
    <li class="chat-item">
      <span class="icon">!</span>
      <span class="name"></span>
      <span class="badge hidden"></span>
      <span class="time"></span>
    </li>
  </template>

  <template id="chat-message-template">
    <div class="message">
      <span class="time"></span>
      <div class="body">
        <div class="line">
          <span class="author"></span><span class="content"></span>
        </div>
        <div class="reactions"></div>
      </div>
    </div>
  </template>

  <template id="reaction-button-template">
    <button class="reaction">
      <span class="emoji"></span>
      <span class="count"></span>
    </button>
  </template>

  <script type="module" src="/domain.js"></script>
</body>
</html>
