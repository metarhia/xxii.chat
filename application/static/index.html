<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="XXII local-first chat: globalstorage CRDT, metacom and WebRTC" />
  <meta name="theme-color" content="#090a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="XXII Chat" />
  <title>XXII Chat</title>
  <link rel="stylesheet" href="/default.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/vnd.microsoft.icon" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <span class="prompt">$</span>
        <h1>xxii.chat</h1>
        <span class="peers"><span class="muted">peers:</span> <span id="peer-count">0</span></span>
      </header>

      <section class="section">
        <h3>CONTACTS</h3>
        <ul id="contact-list" class="list"></ul>
        <p id="contacts-empty" class="hint">Peers appear here when they come online</p>
      </section>

      <section class="section">
        <h3 class="small">CHATS</h3>
        <ul id="chat-list" class="list"></ul>
        <form id="chat-form" class="inline-form">
          <input id="chat-name-input" type="text" maxlength="64" placeholder="+ new chat" />
        </form>
      </section>

      <section class="section session">
        <h3 class="small">SESSION</h3>
        <label class="nick">
          <span class="accent">@</span>
          <input id="username-input" type="text" maxlength="32" placeholder="your nick" />
        </label>
        <div class="status-line">
          <span id="connection-status" class="status offline">offline</span>
          <span id="mesh-status" class="muted"></span>
        </div>
        <div class="tools">
          <button id="install-btn" class="link-btn hidden">[install]</button>
          <button id="update-cache-btn" class="link-btn">[update cache]</button>
          <button id="clear-messages-btn" class="link-btn">[clear database]</button>
        </div>
      </section>
    </aside>

    <main class="chat-view">
      <header class="topbar">
        <button id="menu-btn" class="link-btn menu-btn" title="Menu">[≡]</button>
        <div class="context">
          <span id="chat-title" class="accent">!general</span>
          <span class="separator">|</span>
          <span id="chat-info" class="description"></span>
        </div>
        <nav class="actions">
          <button id="search-btn" class="link-btn">[Search]</button>
          <button id="pins-btn" class="link-btn">[Pin list]</button>
          <button id="members-btn" class="link-btn">[Members]</button>
          <button id="log-btn" class="link-btn">[Log]</button>
        </nav>
      </header>
      <div id="search-bar" class="search hidden">
        <input id="search-input" type="search" placeholder="filter messages in this chat" />
      </div>
      <div id="chat-messages" class="messages">
        <button id="load-more-btn" class="link-btn load-more hidden">[load older messages]</button>
        <div id="message-list" class="message-list"></div>
      </div>
      <form id="composer" class="composer">
        <div class="shortcuts">Ctrl+F: search <span>|</span> Ctrl+P: pinned <span>|</span> Esc: close</div>
        <textarea id="message-input" rows="2" placeholder="> new message to !general"></textarea>
        <div class="composer-bar">
          <div class="composer-tools">
            <button id="emoji-btn" class="link-btn" type="button">[emoji]</button>
            <span id="composer-info" class="muted"></span>
          </div>
          <button id="send-btn" class="send" type="submit">[send]</button>
        </div>
      </form>
    </main>

    <aside id="panel" class="panel">
      <header class="panel-header">
        <span id="panel-title" class="accent">Thread</span>
        <button id="panel-close-btn" class="link-btn">[close]</button>
      </header>
      <section class="panel-body" data-panel="thread">
        <div id="thread-root"></div>
        <div class="divider"><span id="thread-count">0 replies</span></div>
        <div id="thread-replies" class="thread-replies"></div>
        <form id="reply-form" class="reply-form">
          <textarea id="reply-input" rows="2" placeholder="> reply in thread"></textarea>
          <button class="send" type="submit">[reply]</button>
        </form>
      </section>
      <section class="panel-body" data-panel="pins">
        <div id="pin-list" class="pin-list"></div>
      </section>
      <section class="panel-body" data-panel="members">
        <ul id="member-list" class="member-list"></ul>
      </section>
      <section class="panel-body" data-panel="log">
        <div class="panel-tools">
          <button id="clear-log-btn" class="link-btn">[clear]</button>
        </div>
        <pre id="output" class="log"></pre>
      </section>
    </aside>
  </div>

  <div id="palette" class="palette hidden"></div>
  <div id="notification" class="notification hidden"></div>

  <template id="contact-item-template">
    <li class="nav-item contact-item">
      <span class="icon">👤</span>
      <span class="dot"></span>
      <span class="name"></span>
      <span class="badge hidden"></span>
      <span class="time"></span>
    </li>
  </template>

  <template id="chat-item-template">
    <li class="nav-item chat-item">
      <span class="icon"></span>
      <span class="name"></span>
      <span class="badge hidden"></span>
      <span class="time"></span>
    </li>
  </template>

  <template id="message-template">
    <div class="message">
      <span class="time"></span>
      <div class="body">
        <div class="line">
          <span class="author"></span><span class="content"></span>
        </div>
        <div class="reactions"></div>
        <button class="replies hidden">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 2 7l4 4M2 7h8a4 4 0 0 1 4 4v1" /></svg>
          <span class="count"></span>
        </button>
      </div>
      <div class="message-actions">
        <button class="react-btn" title="React">[+]</button>
        <button class="reply-btn" title="Reply in thread">[reply]</button>
        <button class="pin-btn" title="Pin"></button>
      </div>
    </div>
  </template>

  <template id="thread-item-template">
    <div class="thread-item">
      <div class="who"></div>
      <div class="text"></div>
      <div class="reactions"></div>
      <div class="message-actions">
        <button class="react-btn" title="React">[+]</button>
        <button class="pin-btn" title="Pin"></button>
      </div>
    </div>
  </template>

  <template id="pin-item-template">
    <div class="pin-item">
      <div class="who"></div>
      <div class="text"></div>
      <button class="link-btn unpin-btn">[unpin]</button>
    </div>
  </template>

  <template id="member-item-template">
    <li class="member">
      <span class="dot"></span>
      <span class="name"></span>
      <span class="state"></span>
    </li>
  </template>

  <template id="reaction-button-template">
    <button class="reaction">
      <span class="emoji"></span>
      <span class="count"></span>
    </button>
  </template>

  <script type="module" src="/domain.js"></script>
</body>
</html>
